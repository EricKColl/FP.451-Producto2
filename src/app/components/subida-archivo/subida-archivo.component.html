<!-- También se puede soltar el archivo encima (arrastrar y soltar) -->
<div
  class="subida"
  [class.subida--video]="tipo === 'video'"
  [class.subida--arrastrando]="arrastrando"
  (dragenter)="alArrastrar($event, true)"
  (dragover)="alArrastrar($event, true)"
  (dragleave)="alArrastrar($event, false)"
  (drop)="alSoltar($event)"
>
  <div class="subida__vista">
    <img
      *ngIf="url && !vistaRota && tipo === 'foto'"
      [src]="url"
      alt="Foto actual del jugador"
      (error)="vistaRota = true"
    />
    <!-- [muted] como propiedad: el atributo muted no silencia un vídeo creado por Angular -->
    <video
      *ngIf="url && !vistaRota && tipo === 'video'"
      [src]="url"
      [muted]="true"
      controls
      playsinline
      preload="metadata"
      (error)="vistaRota = true"
    ></video>
    <span *ngIf="!url || vistaRota" class="subida__vacia" aria-hidden="true">
      <i
        class="bi"
        [class.bi-person-bounding-box]="tipo === 'foto'"
        [class.bi-film]="tipo === 'video'"
      ></i>
      <small>{{ tipo === 'foto' ? 'o arrástrala aquí' : 'o arrástralo aquí' }}</small>
    </span>
    <!-- Aviso visual mientras se arrastra un archivo por encima -->
    <span *ngIf="arrastrando" class="subida__soltar" aria-hidden="true">
      <i class="bi bi-cloud-arrow-up"></i>Suelta {{ tipo === 'foto' ? 'la foto' : 'el vídeo' }}
    </span>
  </div>

  <div class="subida__panel">
    <label
      class="boton-fantasma subida__boton"
      [class.subida__boton--bloqueado]="progreso !== null"
    >
      <i class="bi bi-upload" aria-hidden="true"></i>
      {{ url ? 'Cambiar ' + nombreTipo : 'Elegir ' + nombreTipo }}
      <input
        type="file"
        class="visually-hidden"
        [id]="idCampo"
        [accept]="limite.formatos.join(',')"
        [disabled]="progreso !== null"
        (change)="alElegirArchivo($event)"
      />
    </label>
    <p class="campo__ayuda">{{ limite.texto }}</p>

    <ng-container *ngIf="progreso !== null">
      <div
        class="subida__barra"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progreso"
        [attr.aria-label]="'Subiendo ' + nombreTipo"
      >
        <span [style.width.%]="progreso"></span>
      </div>
      <p class="campo__ayuda mono">Subiendo… {{ progreso }} %</p>
    </ng-container>

    <p *ngIf="error" class="campo__error" role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ error }}
    </p>
  </div>
</div>

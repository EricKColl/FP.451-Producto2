<section class="plantilla vidrio hud" aria-labelledby="titulo-plantilla">
  <header class="panel-cab">
    <p class="panel-cab__codigo mono" aria-hidden="true">01</p>
    <h2 id="titulo-plantilla" class="panel-cab__titulo">Plantilla</h2>
    <p class="panel-cab__dato mono" aria-hidden="true">{{ jugadores.length }} JUG.</p>
  </header>

  <!-- Filtros: buscador de texto y dos desplegables (parámetros del pipe filtroJugadores) -->
  <div class="filtros">
    <div class="campo">
      <label for="buscar-jugador" class="campo__etq">Buscar jugador</label>
      <div class="input-group campo__caja">
        <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
        <input
          id="buscar-jugador"
          type="search"
          class="form-control"
          placeholder="Nombre o apellidos"
          autocomplete="off"
          spellcheck="false"
          [(ngModel)]="textoBusqueda"
        />
      </div>
    </div>
    <div class="row filtros__fila">
      <div class="col-sm-6 campo">
        <label for="filtrar-posicion" class="campo__etq">Posición</label>
        <select
          id="filtrar-posicion"
          class="form-select campo__caja"
          [(ngModel)]="posicionSeleccionada"
        >
          <option value="">Todas</option>
          <option *ngFor="let posicion of posiciones" [value]="posicion">{{ posicion }}</option>
        </select>
      </div>
      <div class="col-sm-6 campo">
        <label for="filtrar-edad" class="campo__etq">Edad de referencia</label>
        <select id="filtrar-edad" class="form-select campo__caja" [(ngModel)]="rangoEdad">
          <option value="">Todas</option>
          <option value="hasta25">Hasta 25 años</option>
          <option value="26-28">De 26 a 28 años</option>
          <option value="29+">29 años o más</option>
        </select>
      </div>
    </div>
  </div>

  <!-- El pipe se aplica una sola vez: "filtrados" sirve para la lista, el recuento y el aviso -->
  <ng-container
    *ngIf="
      jugadores | filtroJugadores: textoBusqueda : posicionSeleccionada : rangoEdad as filtrados
    "
  >
    <div class="filtros__pie">
      <button type="button" class="btn boton-fantasma" (click)="limpiarFiltros()">
        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Limpiar filtros
      </button>
      <!-- role="status": el lector de pantalla anuncia el número de resultados al filtrar -->
      <p class="recuento mono" role="status">
        <ng-container *ngIf="filtrados.length !== jugadores.length">
          Mostrando {{ filtrados.length }} de {{ jugadores.length }}
        </ng-container>
      </p>
    </div>

    <ul id="lista" class="lista list-unstyled" aria-label="Jugadores de la plantilla">
      <li *ngFor="let jugador of filtrados">
        <!-- Dentro de un <button> solo se permiten elementos en línea: por eso todo son <span> -->
        <button
          type="button"
          class="tarjeta"
          [id]="'jugador-' + jugador.id"
          [class.seleccionada]="jugador.id === idSeleccionado"
          [attr.aria-pressed]="jugador.id === idSeleccionado"
          (click)="seleccionar(jugador)"
        >
          <span class="avatar">
            <!-- alt vacío: el nombre ya aparece al lado y el lector de pantalla no lo repite -->
            <img
              *ngIf="!fotosNoDisponibles.has(jugador.id); else iniciales"
              [src]="jugador.foto"
              alt=""
              width="48"
              height="48"
              (error)="marcarFotoNoDisponible(jugador.id)"
            />
            <ng-template #iniciales>
              <span class="avatar__iniciales" aria-hidden="true">
                {{ jugador.nombre.charAt(0) }}{{ jugador.apellidos.charAt(0) }}
              </span>
            </ng-template>
          </span>
          <span class="tarjeta__datos">
            <span class="tarjeta__nombre">{{ jugador.nombre }} {{ jugador.apellidos }}</span>
            <!-- Separadores solo para lectores de pantalla: "Stephen Curry, Base · 28 años…, dorsal 30" -->
            <span class="visually-hidden">, </span>
            <!-- sin-corte: en pantallas estrechas "1,88" y "m" no se separan -->
            <span class="tarjeta__meta">
              <b>{{ jugador.posicion }}</b> ·
              <span class="sin-corte">{{ jugador.edad }} años</span> ·
              <span class="sin-corte">{{ jugador.altura | number: '1.2-2' }} m</span>
            </span>
          </span>
          <span class="tarjeta__dorsal">
            <span class="visually-hidden">, dorsal </span>{{ jugador.dorsal }}
          </span>
        </button>
      </li>
    </ul>

    <p *ngIf="filtrados.length === 0" class="sin-resultados">
      <i class="bi bi-radar" aria-hidden="true"></i>
      Ningún jugador coincide con la búsqueda. Prueba con otros filtros o pulsa «Limpiar filtros».
    </p>
  </ng-container>

  <p class="creditos">
    <button type="button" class="enlace" aria-haspopup="dialog" (click)="creditos.abrir()">
      <i class="bi bi-camera" aria-hidden="true"></i> Créditos de fotografías
    </button>
  </p>
</section>

<app-creditos #creditos></app-creditos>

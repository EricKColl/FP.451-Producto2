<!doctype html>
<!-- data-bs-theme="dark": Bootstrap usa su modo oscuro y los estilos globales lo ajustan a la paleta del proyecto -->
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>EQUIPO BASKET</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05080f" />
    <meta
      name="description"
      content="Selección histórica de la NBA: plantilla en tiempo real con Cloud Firestore, fichas, estadísticas y vídeos."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Aplicación instalable (PWA): manifiesto e icono para iPhone y iPad -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Equipo Basket" />
    <!-- Tipografías del proyecto (Google Fonts): títulos, texto y datos -->
    <!-- Conexiones que la aplicación necesita nada más arrancar: base de datos y fotos -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Pantalla de arranque: se ve al instante mientras se carga la aplicación (Angular la sustituye) -->
    <style>
      .arranque {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: radial-gradient(70% 60% at 50% 40%, #102542 0%, #05080f 70%);
        color: #e9f2ff;
        font-family: 'Chakra Petch', 'Segoe UI', sans-serif;
      }
      .arranque__anillo {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 2px solid rgb(120 205 255 / 0.18);
        border-top-color: #3fe3ff;
        border-right-color: #ff8a2e;
        animation: arranque-gira 1.1s linear infinite;
        box-shadow: 0 0 40px -6px rgb(63 227 255 / 0.55);
      }
      .arranque__titulo {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .arranque__titulo span {
        color: #3fe3ff;
      }
      .arranque__texto {
        margin: 0;
        color: #6f8098;
        font:
          500 0.72rem 'JetBrains Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      @keyframes arranque-gira {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arranque__anillo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="arranque" role="status">
        <div class="arranque__anillo" aria-hidden="true"></div>
        <p class="arranque__titulo">EQUIPO <span>BASKET</span></p>
        <p class="arranque__texto">Cargando la plantilla…</p>
      </div>
    </app-root>
  </body>
</html>
